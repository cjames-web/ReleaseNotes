title: S&N Infrastructure — Release Notes
description: Internal release notes for all Appenate form spaces
remote_theme: just-the-docs/just-the-docs

url: "" # Leave blank until you know your GitHub Pages URL

# Site logo (optional — add your logo to /assets/images/logo.png to enable)
# logo: "/assets/images/logo.png"

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3

# Navigation
nav_sort: order  # Sort nav items by nav_order value

# Color scheme — use "dark" or leave blank for default light
color_scheme: light

# Footer
footer_content: "S&amp;N Infrastructure — Internal Use Only"

# Plugins required for GitHub Pages
plugins:
  - jekyll-seo-tag

# Exclude files from build
exclude:
  - README.md
